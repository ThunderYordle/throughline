[project]
name = "throughline"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "duckdb==1.1.3",
  "pyarrow==18.1.0",
  "pydantic==2.10.3",
  "httpx==0.28.1",
  "typer==0.15.1",
  "zstandard==0.25.0",
  "pytz==2024.2",  # DuckDB needs it to return TIMESTAMPTZ values
]

[dependency-groups]
dev = [
  "pytest==8.3.4",
  "ruff==0.8.4",
  "mypy==1.13.0",
]

[project.scripts]
throughline = "throughline.cli:app"

[build-system]
requires = ["hatchling==1.26.3"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
packages = ["throughline"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["realdata: needs the GRID starter data (STL_DATA_DIR) or an ingested database (TL_DATA_DIR)"]
